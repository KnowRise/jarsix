baseURL = 'https://jarsix.knowrise.my.id/'
locale = 'id-id'
title = 'JARSIX'
# Dua theme tersedia: 'netblog' (baru, gaya mockup index.html) dan 'mytheme' (lama).
# Ganti nilai di bawah untuk pindah theme, lalu build ulang.
theme = 'netblog'

# Ambil info author (dan tanggal) dari git commit — dipakai untuk
# menampilkan nama lengkap akun CMS yang terakhir mengedit artikel.
enableGitInfo = true

[taxonomies]
  tag = 'tags'

[params]
  description = 'Blog sederhana mata kuliah Jaringan Komputer'
  author = 'KnowRise'
