<header class="site-header">
  <div class="container header-inner">
    <a href="{{ site.BaseURL }}" class="site-logo">
      <span class="logo-badge">H</span>
      <span>{{ site.Title }}</span>
    </a>

    <nav class="site-nav">
      <a href="{{ site.BaseURL }}" class="nav-link {{ if .IsHome }}active{{ end }}">Beranda</a>
      <a href="{{ "tags/" | relURL }}" class="nav-link {{ if eq .Section "tags" }}active{{ end }}">Tags</a>

      <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Ganti mode gelap/terang">
        <!-- Sun icon (shown in dark mode) -->
        <svg class="theme-icon-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
        </svg>
        <!-- Moon icon (shown in light mode) -->
        <svg class="theme-icon-moon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
        </svg>
      </button>
    </nav>
  </div>
</header>
