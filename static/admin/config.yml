backend:
  name: github
  repo: KnowRise/nyoba-hugo
  branch: main
  base_url: https://decap-cms-oauth-lime-three.vercel.app
  auth_endpoint: /api/auth

media_folder: "static/images"
public_folder: "/images"

# Kompres & resize di browser sebelum upload masuk ke GitHub
media_processing:
  enabled: true
  format:
    enabled: true
    default: webp
  quality: 80
  strip_metadata: true
  width: 1600
  height: null

# Logo CMS (halaman login + header)
logo:
  src: /images/logo/logo.webp
  show_in_header: true

collections:
  - name: "posts"
    label: "Posts"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Cover Image", name: "coverImage", widget: "image", required: false }
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "Tag", name: "tag", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }